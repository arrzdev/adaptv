name: E2E

# Browser suites, off the per-push path (pr-checks-design, tier 1). Never a
# required check: a required check that does not run on every PR blocks those
# PRs forever. Marta does not merge a labelled PR with a red `e2e`.
#
#   PR with label `e2e`  -> `e2e`: chromium, the PR suites in one job
#                           (`plain`: the lab app built with no Tailwind)
#   nightly on main      -> `e2e`: same job, and `e2e-stress`: the stress suite
#                           on chromium in two shards, beside it. Both skipped if
#                           main has not moved since the last green scheduled
#                           run; a red night opens one issue
#   weekly + on demand   -> `e2e-full`: every suite x chromium + webkit, with
#                           stress. Run it before any release of adaptv.
#   dispatch, `nightly`  -> the nightly jobs, on the ref it was dispatched on
#
# No retries, in the configs or here (docs/guides/e2e.md §3.1). A re-run is a
# human decision, recorded as attempt #2 on the run. `update.spec.ts` on
# chromium used to be intermittent in the worker suites. The cause (the
# launch-apply posting SKIP_WAITING mid-load) is fixed, so a red one now is a
# regression (docs/design/rendering.md §3.4).
on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  schedule:
    - cron: "0 3 * * *" # nightly
    - cron: "0 4 * * 0" # weekly full matrix (Sunday)
  workflow_dispatch:
    inputs:
      scope:
        description: "full: every suite x both engines. nightly: what the nightly runs."
        type: choice
        options: [full, nightly]
        default: full

permissions:
  contents: read

# A dispatch's scope is part of the group, so a `nightly` and a `full` dispatch on one ref both run.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}-${{ github.event.schedule || github.event_name }}${{ inputs.scope && format('-{0}', inputs.scope) || '' }}
  cancel-in-progress: true

env:
  CI: 1
  #Below the runner's ephemeral range (32768-60999): the kernel hands those ports to outgoing
  #connections, and a build that fetches while the server boots can hold the one we are about to
  #listen on (EADDRINUSE, sw-spa 41760).
  E2E_PORT: 31730
  E2E_SW_PORT: 31750
  E2E_SW_SPA_PORT: 31760
  E2E_SW_PROMPT_PORT: 31770
  E2E_PLAIN_PORT: 31780

jobs:
  e2e:
    if: >-
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - name: Skip if main has not moved
        id: moved
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(gh run list -R "$GITHUB_REPOSITORY" --workflow e2e.yml --event schedule --branch main --status success -L 1 --json headSha --jq '.[0].headSha' 2>/dev/null || true)"
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main is at ${GITHUB_SHA:0:7}, already green in a scheduled run: skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.moved.outputs.run != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        if: steps.moved.outputs.run != 'false'
        uses: ./.github/actions/setup

      - name: Install (playground)
        if: steps.moved.outputs.run != 'false'
        run: pnpm playground:setup

      - name: Browser cache
        if: steps.moved.outputs.run != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('playground/pnpm-lock.yaml') }}

      - name: Browser (chromium)
        if: steps.moved.outputs.run != 'false'
        run: pnpm --dir playground exec playwright install --with-deps chromium

      # In sequence, in one job: four jobs would each pay setup and a rounded-up
      # minute. Every suite runs even if an earlier one failed.
      - name: Test (playwright, chromium)
        id: e2e
        if: steps.moved.outputs.run != 'false'
        run: |
          set -o pipefail
          failed=()
          for script in test:e2e test:e2e:plain test:e2e:sw test:e2e:sw:spa test:e2e:sw:prompt; do
            echo "::group::${script}"
            if ! pnpm --dir playground "$script" --project=chromium; then failed+=("$script"); fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed: ${failed[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All chromium suites passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-chromium
          path: playground/playwright-report/
          retention-days: 14

  # The stress suite every night, so a stress regression is seen the next morning
  # rather than on Sunday. Chromium only: webkit stays in the weekly `e2e-full`.
  # One worker per config, ~30 min in one job; two shards of ~15 min run beside
  # `e2e`, so the nightly takes no longer than it did.
  e2e-stress:
    name: e2e-stress (chromium, ${{ matrix.shard }}/2)
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Skip if main has not moved
        id: moved
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(gh run list -R "$GITHUB_REPOSITORY" --workflow e2e.yml --event schedule --branch main --status success -L 1 --json headSha --jq '.[0].headSha' 2>/dev/null || true)"
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main is at ${GITHUB_SHA:0:7}, already green in a scheduled run: skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.moved.outputs.run != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        if: steps.moved.outputs.run != 'false'
        uses: ./.github/actions/setup

      - name: Install (playground)
        if: steps.moved.outputs.run != 'false'
        run: pnpm playground:setup

      - name: Browser cache
        if: steps.moved.outputs.run != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('playground/pnpm-lock.yaml') }}

      - name: Browser (chromium)
        if: steps.moved.outputs.run != 'false'
        run: pnpm --dir playground exec playwright install --with-deps chromium

      - name: Test (playwright, stress, chromium, ${{ matrix.shard }}/2)
        id: e2e
        if: steps.moved.outputs.run != 'false'
        run: pnpm --dir playground test:e2e:stress --project=chromium --shard=${{ matrix.shard }}/2

      - name: Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-stress-chromium-${{ matrix.shard }}
          path: playground/playwright-report/
          retention-days: 14

  # One issue per red night, however many of `e2e` and the two stress shards failed.
  nightly-issue:
    needs: [e2e, e2e-stress]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue for a red nightly
        env:
          GH_TOKEN: ${{ github.token }}
          E2E: ${{ needs.e2e.result }}
          STRESS: ${{ needs.e2e-stress.result }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "nightly e2e failed on ${GITHUB_SHA:0:7}" \
            --body "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (e2e: ${E2E}, e2e-stress: ${STRESS}). Fix forward on a PR."

  e2e-full:
    name: e2e-full (${{ matrix.suite }}, ${{ matrix.engine }})
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.scope != 'nightly') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0')
    runs-on: ubuntu-latest
    # A backstop, not a budget: every spec is capped by its own test timeout.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [main, plain, stress, sw, sw-spa, sw-prompt, sw-node, sw-subpath]
        engine: [chromium, webkit]
        include:
          - suite: main
            script: test:e2e
          - suite: plain
            script: test:e2e:plain
          - suite: stress
            script: test:e2e:stress
          - suite: sw
            script: test:e2e:sw
          - suite: sw-spa
            script: test:e2e:sw:spa
          - suite: sw-prompt
            script: test:e2e:sw:prompt
          - suite: sw-node
            script: test:e2e:sw:node
          - suite: sw-subpath
            script: test:e2e:sw:subpath
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install (playground)
        run: pnpm playground:setup

      - name: Browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.engine }}-${{ hashFiles('playground/pnpm-lock.yaml') }}

      - name: Browser (${{ matrix.engine }})
        run: pnpm --dir playground exec playwright install --with-deps ${{ matrix.engine }}

      - name: Test (playwright, ${{ matrix.suite }}, ${{ matrix.engine }})
        id: e2e
        run: pnpm --dir playground ${{ matrix.script }} --project=${{ matrix.engine }}

      - name: Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.suite }}-${{ matrix.engine }}
          path: playground/playwright-report/
          retention-days: 14
