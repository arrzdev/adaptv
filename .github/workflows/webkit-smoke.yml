name: WebKit smoke

# What `create-adaptv` scaffolds, installed from the packed tarballs, built, served and driven
# in Playwright's WebKit at an iPhone 15 size: launch, navigate, keyboard, back. Screenshots of
# each step are the artifact. On demand (run it before a release of adaptv) and on a PR that
# changes the smoke itself. Never a required check.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/webkit-smoke.yml
      - .github/webkit-smoke/**

permissions:
  contents: read

concurrency:
  group: webkit-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 1

jobs:
  webkit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install WebKit
        run: npx --yes playwright@1.61.1 install --with-deps webkit

      - name: Smoke in WebKit
        run: bash .github/webkit-smoke/smoke.sh "$RUNNER_TEMP/webkit-smoke"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-smoke
          path: ${{ runner.temp }}/webkit-smoke
          if-no-files-found: ignore
          retention-days: 14
