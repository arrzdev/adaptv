name: CI

# Simple test-only CI: no envs, no deploys — typecheck + biome + vitest + the live
# layer's colour check on every PR and on pushes to main, with a rendered job summary.
# These are `pnpm gate` minus nothing: a check that only runs locally binds only the
# person who remembered to run it.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Each check runs even if a prior one failed (if: always()), so the summary
      # reports ALL failures at once. A failed step still fails the job.
      - name: Typecheck
        id: typecheck
        run: pnpm typecheck

      - name: Lint (biome)
        id: biome
        if: always()
        run: pnpm biome:check

      # The playground is its own pnpm project, so the root `biome check .` above
      # never reaches it. Without this step the gate's playground check only binds
      # whoever runs `pnpm gate` locally — which is how two PRs landed unformatted
      # playground files on main in a single afternoon. The script provisions the
      # playground's own install on first run, so no extra install step is needed.
      - name: Lint (biome, playground)
        id: biome_playground
        if: always()
        run: pnpm biome:check:playground

      - name: Test (vitest)
        id: test
        if: always()
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee vitest-output.txt

      # The one check no unit test can make. Ink drops props it does not recognise in
      # SILENCE, so a mis-named role (`ink:` for `color`, `dim` for `dimColor`) renders the
      # whole live layer flat and every assertion still passes — chalk fixes its colour level
      # from the real stdout at import time, and vitest's fake stdout is not a terminal, so a
      # unit test there measures the harness. This runs the components under a pty and greps
      # the bytes. It was in `pnpm gate` only, which binds whoever remembers to run the gate —
      # the same gap that put unformatted playground files on main twice.
      - name: Colour (live layer)
        id: colour
        if: always()
        run: node scripts/check-colour.mjs

      - name: Job summary
        if: always()
        run: |
          icon() { [ "$1" = "success" ] && echo "✅ pass" || echo "❌ fail"; }
          tally=$(grep -oE 'Tests[[:space:]]+[0-9]+ (passed|failed)' vitest-output.txt | head -1 || true)
          files=$(grep -oE 'Test Files[[:space:]]+[0-9]+ (passed|failed)' vitest-output.txt | head -1 || true)
          {
            echo "## adaptv CI"
            echo ""
            echo "| Check | Result |"
            echo "| --- | :---: |"
            echo "| Typecheck (\`tsc --noEmit\`) | $(icon '${{ steps.typecheck.outcome }}') |"
            echo "| Biome (\`biome check\`) | $(icon '${{ steps.biome.outcome }}') |"
            echo "| Biome (playground) | $(icon '${{ steps.biome_playground.outcome }}') |"
            echo "| Tests (\`vitest\`) | $(icon '${{ steps.test.outcome }}') |"
            echo "| Colour (live layer) | $(icon '${{ steps.colour.outcome }}') |"
            echo ""
            [ -n "$files" ] && echo "**${files}** · **${tally}**"
            echo ""
            echo "_Commit \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\`._"
          } >> "$GITHUB_STEP_SUMMARY"
