name: CI

# The PR gate. One job, `gate`, which branch protection requires on `main` and
# `staging`. No `push` trigger: deploy.yml's verify runs the same gate after the
# merge, so a CI run on the merged commit would be the same check a third time.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # One job on purpose: every job is billed rounded up to a whole minute, so
  # small guards in their own jobs cost more than the work they do. The
  # docs-only shortcut lives INSIDE the job, never as a workflow `paths`
  # filter: a required check whose workflow is skipped stays pending forever.
  #
  # Draft PRs run nothing (TUD-222): the job is skipped by `if`, which bills no
  # minute and reports `gate` as skipped. A draft cannot merge, and marking it
  # ready (`ready_for_review`) runs the full gate on the same head commit, so a
  # skipped draft run never lets a change through. Open PRs as draft, run the
  # gate locally, and mark the PR ready once, when it is green.
  #
  # No `environment:` binding and no secrets: a PR that adds an env var passes
  # here without anyone provisioning an environment first, and forks run it.
  gate:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # migration safety and affected tests diff against the base

      - name: Choose gate mode
        id: mode
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE"...HEAD)"
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^(docs/|\.claude/)|\.md$'; then
            mode=docs
          else
            mode=full
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Gate mode: **${mode}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Gate
        uses: ./.github/actions/gate
        with:
          mode: ${{ steps.mode.outputs.mode }}
          base: ${{ github.event.pull_request.base.sha }}
