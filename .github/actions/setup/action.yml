name: Setup
description: Set up pnpm and Node, then install dependencies

runs:
  using: composite
  steps:
    # No `version`: pnpm comes from package.json#packageManager.
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        # The playground is its own pnpm project with its own lockfile; both feed the
        # one store, so both belong in the cache key.
        cache-dependency-path: |
          pnpm-lock.yaml
          playground/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
