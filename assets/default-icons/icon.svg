<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!--
  adaptv's default launcher mark — the icon an app wears when it has none of its own.

  Two corner brackets and a disc. The brackets are opposite corners of a frame that is never
  drawn, so the frame is whatever size the viewport is; the disc is the app sitting inside it.
  Rotationally symmetric about the centre — the bottom-right bracket is the top-left one
  mirrored through (512, 512), which is what keeps it from reading as hand-placed.

  ⚠︎ The <svg> element comes FIRST and this note lives inside it. sharp sniffs the head of a
  file to identify the format, and a comment long enough to push the root element past that
  window makes an otherwise-valid SVG fail with "Input file contains unsupported image format".

  FULL BLEED and a FLAT background, and both are the rule for any icon source rather than
  quirks of this one:

  · Full bleed, because every platform applies its OWN mask — iOS rounds the corners, Android
    cuts a circle or a squircle depending on the launcher. Art that draws its own rounded-square
    background gets rounded twice, and reads as a small tile floating inside the mask.

  · Flat, because that is what lets adaptv SEE the mark. measureArtwork reads the border ring:
    transparent or one colour means the logo can be isolated, re-centred and zoomed out until it
    clears the mask. A gradient is unclassifiable, so the mark is left where the designer put it
    and the mask crops whatever reaches the edge.

  Geometry, if you ever redraw it: everything sits inside a centred circle of radius 410, which
  is what clears every platform mask before the generator's own margin is applied. The bracket
  stroke is 100 with round caps and joins, so each arm reads 154 long from the corner. White on
  the theme indigo also gives the luminance contrast the iOS tinted and Android monochrome
  variants are derived from — `gen icons` writes both without needing an override.
-->
  <rect width="1024" height="1024" fill="#5563d6"/>
  <circle cx="512" cy="512" r="164" fill="#fff"/>
  <g fill="none" stroke="#fff" stroke-width="100" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 400 V296 H360"/>
    <path d="M768 624 V728 H664"/>
  </g>
</svg>
