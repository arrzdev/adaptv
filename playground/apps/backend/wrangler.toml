name = "chopchop-backend"
main = "entrypoint/worker.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
minify = true
upload_source_maps = false

# Runtime env (BETTER_AUTH_SECRET, BETTER_AUTH_URL, FRONTEND_URL, oauth creds) is
# deliberately NOT declared here. The deploy uploads it onto the Worker as
# secrets from the GH-action-written env/.env — `wrangler versions upload
# --secrets-file env/.env`, see .github/scripts/deploy/app.sh — so env is driven
# entirely by the per-environment GitHub secrets/vars, never the CF dashboard.

[dev]
ip = "0.0.0.0"
port = 41830
inspector_port = 41840

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
# NOTE: the deploy derives the migration target as `<worker-name>-db` (app.sh), so this
# label must track the worker name. The real database is bound by `database_id` below —
# unchanged, so no data moves; only the label the migration step resolves against.
database_name = "chopchop-backend-db"
database_id = "dac5fd2a-447e-4b3b-8846-26003ef83ef5"
migrations_dir = "src/database/migrations"

# Staging environment — deployed via `wrangler ... --env staging` (see the
# Deploy workflow + deploy-backend-worker.sh). Named envs do NOT inherit
# bindings, so DB + observability are repeated here; shared keys (main,
# compatibility_*, minify) ARE inherited from the top level.
[env.staging]
name = "chopchop-backend-staging"

# crons ARE an inherited key: the day a top-level [triggers] cron is added, staging would
# silently pick it up. An explicit empty list means "none", and the deploy's `wrangler
# triggers deploy` applies that emptiness rather than leaving it to inheritance. Backend
# declares no queues and no crons today, so this is pure future-proofing.
[env.staging.triggers]
crons = []

[env.staging.observability]
enabled = true
head_sampling_rate = 1

# A SEPARATE staging database — never point this at the production database_id.
# Create it once: `wrangler d1 create chopchop-backend-staging-db`, then paste its id.
[[env.staging.d1_databases]]
binding = "DB"
database_name = "chopchop-backend-staging-db"
database_id = "REPLACE_WITH_STAGING_D1_DATABASE_ID"
migrations_dir = "src/database/migrations"
