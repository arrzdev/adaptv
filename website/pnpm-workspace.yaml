# The website is its OWN pnpm project, exactly as `playground/` is: without this file
# `pnpm install` here walks up, finds the repo root's workspace file, and installs the
# framework instead of the site. It links the local adaptv checkout (`link:..`), and the
# singletons adaptv itself resolves — react, react-dom, vite, motion — are links to the
# ROOT copies, so there is one instance of each (two Reacts is a null-dispatcher crash).
packages:
  - "."
allowBuilds:
  esbuild: true
# Lift @tailwindcss/node's source-map-js off a version with a high advisory. The selector
# touches only the vulnerable range; drop it once the parent ships the fix.
overrides:
  "source-map-js@<1.2.2": "^1.2.2"
