# pnpm settings only. esbuild ships a prebuilt binary and only verifies it; sharp
# resolves a prebuilt one from its optional deps and never needs its build step.
allowBuilds:
  esbuild: true
  sharp: false
# pnpm applies `patchedDependencies` only from the root of the project it installs, so
# adaptv cannot carry its patches to an app: the app declares them. Without the
# router-generator patch the first `adaptv build web` writes a second `createFileRoute`
# import into every route file. An app outside this repo copies the files from
# `node_modules/@arrzdev/adaptv/patches/` into its own `patches/` and names them there.
patchedDependencies:
  '@capacitor/cli@8.4.3': ../../patches/@capacitor__cli@8.4.3.patch
  '@capawesome/capacitor-live-update@8.3.0': ../../patches/@capawesome__capacitor-live-update@8.3.0.patch
  '@tanstack/router-generator@1.167.21': ../../patches/@tanstack__router-generator@1.167.21.patch
  '@tanstack/start-plugin-core@1.171.24': ../../patches/@tanstack__start-plugin-core@1.171.24.patch
  'native-run@2.0.3': ../../patches/native-run@2.0.3.patch
