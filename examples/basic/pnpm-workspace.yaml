# pnpm settings only. esbuild ships a prebuilt binary and only verifies it; sharp
# resolves a prebuilt one from its optional deps and never needs its build step.
allowBuilds:
  esbuild: true
  sharp: false
# adaptv's dependency patches. pnpm applies `patchedDependencies` only from the root of
# the project it installs, so a package cannot bring its own: the app carries them in
# `patches/`. They change how native builds and over-the-air updates behave. When you
# upgrade adaptv, copy `node_modules/adaptv/patches/` over `patches/` and update
# the keys to match.
patchedDependencies:
  '@capacitor/cli@8.4.3': patches/@capacitor__cli@8.4.3.patch
  '@capawesome/capacitor-live-update@8.3.0': patches/@capawesome__capacitor-live-update@8.3.0.patch
  'native-run@2.0.3': patches/native-run@2.0.3.patch
