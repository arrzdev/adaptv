# Single-package repo — this file only carries pnpm settings. esbuild ships a
# prebuilt platform binary; allow its (verification) build script so the pre-run
# deps check doesn't flag it as unbuilt on every `pnpm <script>`.
allowBuilds:
  esbuild: true
  # sharp resolves a prebuilt binary from its `@img/sharp-*` optional deps, so it never
  # needs the compile fallback. Left false deliberately: adaptv depends on sharp to render
  # launcher icons, and a consumer install must not stall on a native build step. On a
  # platform with no prebuilt binary the import fails and the CLI degrades to one icon
  # warning (bin/lib/icons.mjs `loadSharp`), which is the right failure.
  sharp: false
# Version-PINNED patch keys (not bare names): a patch is written against a specific
# version's code, so pin it. If the resolved version ever drifts, pnpm fails the install
# LOUDLY (no matching version) instead of silently applying the patch to changed code —
# the guardrail that keeps a rented+patched core from breaking a new install. Bumping the
# upstream version is then a deliberate act: re-verify the patch, update the key.
patchedDependencies:
  '@capacitor/cli@8.4.2': patches/@capacitor__cli@8.4.2.patch
  '@capawesome/capacitor-live-update@8.3.0': patches/@capawesome__capacitor-live-update@8.3.0.patch
  '@tanstack/router-generator@1.167.21': patches/@tanstack__router-generator@1.167.21.patch
  '@tanstack/start-plugin-core@1.171.24': patches/@tanstack__start-plugin-core@1.171.24.patch
